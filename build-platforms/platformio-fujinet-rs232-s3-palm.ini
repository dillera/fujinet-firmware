; FN-RS232 (ESP32-S3) as a Palm OS HotSync server: the RS-232 port goes to a
; Palm cradle (through a null modem) instead of a host computer.
[fujinet]
build_platform = BUILD_RS232
build_bus      = rs232
build_board    = fujinet-rs232-s3-palm

[env]
upload_port = /dev/ttyACM0 ; Linux esp32s3
monitor_port = /dev/ttyACM0 ; Linux esp32s3

[env:fujinet-rs232-s3-palm]
platform = espressif32@${fujinet.esp32s3_platform_version}
platform_packages = ${fujinet.esp32s3_platform_packages}
board = esp32-s3-wroom-1-n16r8
build_type = debug
build_flags =
    ${env.build_flags}
    -D PINMAP_RS232_S3
    -D HOTSYNC_CRADLE_DEFAULT
board_build.cmake_extra_args = -D CONFIG_IDF_TARGET_ESP32S3=1 ; extra arguments for CMake
