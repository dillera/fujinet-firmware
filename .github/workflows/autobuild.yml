name: "FujiNet CI"

# Only run when files that feed the firmware build change. The path list is
# "everything, minus what provably cannot affect the build" -- docs, notes,
# markdown, the pico/ trees (covered by pico-carts.yml), and PC-only sources.
# Workflow config that DOES feed this build (this file and the release INIs)
# is re-included after the blanket .github exclusion.
on:
  push:
    # Do not build tags. Do not build release branch
    branches:
      - "**"
      - "!release"
    tags:
      - "!**"
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!notes/**"
      - "!pico/**"
      - "!components_pc/**"
      - "!fujinet_pc.cmake"
      - "!LICENSE"
      - "!.gitignore"
      - "!.clang-format"
      - "!.dir-locals.el"
      - "!.travis.yml"
      - "!.github/**"
      - ".github/workflows/autobuild.yml"
      - ".github/workflows/platformio.release-*.ini"
  pull_request:
    # Do not build release branch
    branches:
      - "**"
      - "!release"
    # Keep in sync with the push paths above.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!notes/**"
      - "!pico/**"
      - "!components_pc/**"
      - "!fujinet_pc.cmake"
      - "!LICENSE"
      - "!.gitignore"
      - "!.clang-format"
      - "!.dir-locals.el"
      - "!.travis.yml"
      - "!.github/**"
      - ".github/workflows/autobuild.yml"
      - ".github/workflows/platformio.release-*.ini"
  workflow_dispatch:

jobs:
  tagged-release:
    name: "PlatformIO CI"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        target-platform:
          - ADAM
          - APPLE
          - ATARI
          - ATARI-esp32-s3-wroom-1-n16r8
          - COCO
          - IEC-LOLIN-D32
          - IEC-NUGGET
          - LYNX
          - LYNX-S3
          - RS232

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.1'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install setuptools
        pip install --upgrade platformio
        pip install Jinja2
        pip install pyyaml

    - name: Show python version
      run: python --version

    - name: Show pio system info
      run: pio system info

    - name: Show pio location
      run: pip show platformio

    - name: Create PlatformIO INI for Build
      run: cd "$GITHUB_WORKSPACE" && /usr/bin/bash ./build.sh -l "$GITHUB_WORKSPACE"/.github/workflows/platformio.release-${{ matrix.target-platform }}.ini -i "$GITHUB_WORKSPACE"/platformio-generated.ini

    - name: Show platformio.ini
      run: cat "$GITHUB_WORKSPACE"/platformio-generated.ini

    - name: Get Old Version
      id: version
      run: echo "VERSION=$(grep '#define FN_VERSION_FULL' /home/runner/work/fujinet-firmware/fujinet-firmware/include/version.h | sed 's/^.*"\(.*\)".*$/\1/')" >> $GITHUB_OUTPUT

    - name: Create "version.txt" file
      run: echo "${{ steps.version.outputs.VERSION }}.${{ matrix.target-platform }}" > "$GITHUB_WORKSPACE"/version.txt

    - name: Build release
      run: cd "$GITHUB_WORKSPACE" && /usr/bin/bash ./build.sh -z -l "$GITHUB_WORKSPACE"/.github/workflows/platformio.release-${{ matrix.target-platform }}.ini -i "$GITHUB_WORKSPACE"/platformio-generated.ini

    - name: Upload firmware zip for ${{ matrix.target-platform }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.target-platform }}
        path: firmware/**
